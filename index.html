<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON BLOCKS">
<meta name="theme-color" content="#08001a">
<title>NEON BLOCKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:#08001a; --bg-2:#14002a;
    --neon-pink:#ff2bd6; --neon-cyan:#00f0ff; --neon-yellow:#ffe600;
    --neon-green:#00ff88; --neon-purple:#c800ff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; background:#000; color:#fff;
    font-family:'VT323', monospace;
    overscroll-behavior:none; touch-action:none;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,43,214,0.35), transparent 55%),
      radial-gradient(ellipse at 80% 30%, rgba(0,240,255,0.30), transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(200,0,255,0.30), transparent 60%),
      radial-gradient(ellipse at 10% 80%, rgba(0,255,136,0.20), transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, #000 100%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:100;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }
  @keyframes drift {
    0%   { filter: hue-rotate(0deg) saturate(1.1); }
    50%  { filter: hue-rotate(40deg) saturate(1.3); }
    100% { filter: hue-rotate(-30deg) saturate(1.2); }
  }

  #game {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    padding: max(6px, env(safe-area-inset-top))
             max(6px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom))
             max(6px, env(safe-area-inset-left));
    gap:6px;
  }

  /* HUD: 5 cells in a single row, fixed height so it never overlaps the board */
  #hud {
    flex: 0 0 56px;
    display: grid;
    grid-template-columns: 56px 1fr 1fr 1fr 56px;
    gap: 5px;
    height: 56px;
  }
  .stat {
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    box-shadow: inset 0 0 6px rgba(200,0,255,0.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2px;
    min-width: 0;
    overflow: hidden;
  }
  .stat .label {
    font-family:'Press Start 2P', monospace;
    font-size:6px; letter-spacing:1px;
    color:var(--neon-pink); text-shadow:0 0 4px var(--neon-pink);
  }
  .stat .value {
    font-family:'Press Start 2P', monospace;
    font-size:10px; color:#fff;
    text-shadow:0 0 6px var(--neon-cyan), 0 0 12px var(--neon-cyan);
    margin-top:5px; line-height:1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    max-width: 100%;
  }
  .mini-box {
    background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    box-shadow: inset 0 0 8px rgba(0,240,255,0.18), 0 0 8px rgba(255,43,214,0.2);
    display:flex; flex-direction:column; align-items:center;
    padding-top:3px;
    transition: opacity 0.25s, filter 0.25s;
  }
  .mini-box.locked {
    opacity: 0.5;
    filter: grayscale(0.6);
  }
  .mini-label {
    font-family:'Press Start 2P', monospace;
    font-size:6px; letter-spacing:1px;
    color:var(--neon-cyan); text-shadow:0 0 4px var(--neon-cyan);
  }
  .mini-canvas { width:46px; height:38px; display:block; margin-top:2px; }

  #play-wrap {
    flex:1 1 auto; position:relative;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  #play {
    display:block;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(20,0,50,0.6));
    border:2px solid rgba(255,255,255,0.08);
    border-radius:10px;
    box-shadow:
      0 0 30px rgba(0,240,255,0.45),
      0 0 60px rgba(255,43,214,0.35),
      0 0 90px rgba(200,0,255,0.25);
    touch-action:none;
  }
  #pause-btn {
    position:absolute; top:8px; right:8px;
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--neon-yellow);
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 10px rgba(255,230,0,0.4);
    cursor:pointer; z-index:10;
  }
  #pause-btn:active { transform:scale(0.92); filter:brightness(1.4); }

  #overlay {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(20,0,50,0.85), rgba(0,0,0,0.95));
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    z-index:50; text-align:center; padding:24px;
    transition:opacity 0.3s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 {
    font-family:'Monoton', cursive;
    font-size:62px; margin:0 0 6px; line-height:1;
    background: linear-gradient(180deg, var(--neon-cyan), var(--neon-pink) 60%, var(--neon-purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 10px var(--neon-pink)) drop-shadow(0 0 18px var(--neon-cyan));
    letter-spacing:4px;
    animation: titlePulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes titlePulse {
    from { filter: drop-shadow(0 0 6px var(--neon-pink)) drop-shadow(0 0 12px var(--neon-cyan)); }
    to   { filter: drop-shadow(0 0 16px var(--neon-pink)) drop-shadow(0 0 28px var(--neon-cyan)); }
  }
  #overlay .sub {
    font-family:'Press Start 2P', monospace;
    font-size:11px; color:var(--neon-yellow);
    text-shadow:0 0 8px var(--neon-yellow);
    margin:14px 0 14px; letter-spacing:2px;
  }
  #stats-final {
    font-family:'VT323', monospace;
    font-size:24px; line-height:1.3;
    margin:4px 0 18px; text-shadow:0 0 6px var(--neon-cyan);
  }
  #stats-final span { color:var(--neon-pink); text-shadow:0 0 8px var(--neon-pink); }
  #start-btn {
    appearance:none;
    border:2px solid var(--neon-pink);
    background:rgba(255,43,214,0.15);
    color:#fff;
    font-family:'Press Start 2P', monospace;
    font-size:13px; padding:14px 24px; border-radius:8px;
    text-shadow:0 0 8px var(--neon-pink);
    box-shadow:0 0 16px var(--neon-pink), inset 0 0 14px rgba(255,43,214,0.3);
    cursor:pointer; letter-spacing:2px;
  }
  #start-btn:active { transform:scale(0.96); filter:brightness(1.3); }
  .hint {
    font-family:'VT323', monospace;
    font-size:19px; color:rgba(255,255,255,0.85);
    margin-top:22px; line-height:1.55;
  }
  .hint b {
    color:var(--neon-cyan); font-weight:normal;
    text-shadow:0 0 6px var(--neon-cyan);
  }
  @keyframes shake {
    0%,100% { transform:translate(0,0); }
    25% { transform:translate(-4px,2px); }
    50% { transform:translate(3px,-3px); }
    75% { transform:translate(-2px,-2px); }
  }
  .shake { animation:shake 0.35s; }
  @keyframes flashGlow {
    0%,100% { box-shadow:
      0 0 30px rgba(0,240,255,0.45),
      0 0 60px rgba(255,43,214,0.35),
      0 0 90px rgba(200,0,255,0.25); }
    50% { box-shadow:
      0 0 60px var(--neon-yellow),
      0 0 120px var(--neon-pink); }
  }
  .flashing { animation:flashGlow 0.6s; }
</style>
</head>
<body>

    <header id="hud">
      <div id="hold-box" class="mini-box">
        <span class="mini-label">HOLD</span>
        <canvas id="hold" class="mini-canvas" width="46" height="38"></canvas>
      </div>
      <div class="stat"><span class="label">SCORE</span><span id="score" class="value">0</span></div>
      <div class="stat"><span class="label">LVL</span><span id="level" class="value">1</span></div>
      <div class="stat"><span class="label">LINES</span><span id="lines" class="value">0</span></div>
      <div class="mini-box">
        <span class="mini-label">NEXT</span>
        <canvas id="next" class="mini-canvas" width="46" height="38"></canvas>
      </div>
    </header>

    <main id="play-wrap">
      <canvas id="play"></canvas>
      <button id="pause-btn" aria-label="Pause">II</button>
    </main>

    <div id="overlay">
      <h1>NEON<br>BLOCKS</h1>
      <div class="sub" id="overlay-sub">A TETRIS REMIX</div>
      <div id="stats-final" style="display:none;"></div>
      <button id="start-btn">TAP TO START</button>
